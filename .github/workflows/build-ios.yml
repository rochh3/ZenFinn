name: Build iOS IPA

on:
  # Manual: Actions > (este workflow) > Run workflow. Evita compilar en cada push.
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      # Se incrustan en la app al compilar (la anon key es pública; la protege RLS)
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - name: Comprobar secretos de la app
        run: |
          missing=""
          [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] && missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] && missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos en Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
          [ -z "$EXPO_PUBLIC_API_URL" ] && echo "::warning::EXPO_PUBLIC_API_URL no definido: el asistente de IA no funcionará en la app"
          exit 0

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Generate iOS project (Prebuild)
        working-directory: ./mobile
        run: npx expo prebuild -p ios --clean

      - name: Fix Node path for Xcode
        working-directory: ./mobile/ios
        run: echo "export NODE_BINARY=$(command -v node)" > .xcode.env.local

      - name: Install CocoaPods
        working-directory: ./mobile/ios
        run: pod install

      - name: Build unsigned iOS app (.app)
        working-directory: ./mobile/ios
        run: |
          xcodebuild \
            -workspace mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into .ipa
        working-directory: ./mobile/ios
        run: |
          mkdir -p Payload
          mv derived_data/Build/Products/Release-iphoneos/mobile.app Payload/
          zip -qr ZenFin.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenFin-IPA
          path: mobile/ios/ZenFin.ipa
