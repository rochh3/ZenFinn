name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Generate iOS project (Prebuild)
        working-directory: ./mobile
        run: npx expo prebuild -p ios --clean

      - name: Install CocoaPods
        working-directory: ./mobile/ios
        run: pod install

      - name: Build unsigned iOS app (.app)
        working-directory: ./mobile/ios
        run: |
          xcodebuild \
            -workspace mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into .ipa
        working-directory: ./mobile/ios
        run: |
          mkdir -p Payload
          mv derived_data/Build/Products/Release-iphoneos/mobile.app Payload/
          zip -qr ZenFin.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenFin-IPA
          path: mobile/ios/ZenFin.ipa
