name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # Se incrustan en la app al compilar (la anon key es pública; la protege RLS)
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Generate Android project (Prebuild)
        working-directory: ./mobile
        run: npx expo prebuild -p android --clean

      - name: Build APK (release)
        working-directory: ./mobile/android
        # Expo firma la release con la clave de depuración: el APK se puede instalar directamente.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenFin-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
